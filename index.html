<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <title>PodFreitas</title>
    </head>
    <body>
        <header>
            <h1 id="titulo">PodFreitas</h1>
            <nav>
                <a href="#">inicio</a>
                <a href="#">sobre</a>
            </nav>
        </header>
        <main>
            <section class="hero">
                <h2>PodFreitas</h2>
                <p>Conversas divertidas sobre games e cultura</p>
                <button>Ouvir</button>
            </section>

            <section class="episodios">
                <h3>Ultimos episodios</h3>
                <div class="grade-episodios">
                    <article class="card">
                        <img src="img/Podcast.jpg" alt="capa do episodio 1">
                        <h4>O Inicio de Tudo</h4>
                        <p>Neste episodio contamos como o PodFreitas começou</p>
                    </article>

                    <article class="card">
                        <img src="img/Github.jpg" alt="capa do episodio 2">
                        <h4>Git e Github</h4>
                        <p>Luiz e David explicam como usar o Git e Github</p>
                    </article>

                    <article class="card">
                        <img src="img/Magia.jpg" alt="capa do episodio 3">
                        <h4>A Magia</h4>
                        <p>A magia de planejar o design do seu site</p>
                    </article>
                </div>

            </section>
            
        </main>
    </body>
</html>
